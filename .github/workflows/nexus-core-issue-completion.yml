name: Nexus Core issue completion

# Two-job consumer workflow for the Nexus Core issue gate.
# - 'run' produces and Sigstore-signs the receipt (needs id-token: write).
# - 'verify' is the required check: it verifies the signature against THIS
#   workflow file on the default branch and checks the receipt against the exact
#   head, base config and Issue.
# Requires container isolation ([isolation] mode = "container") in the
# repository's committed .nexus-core/config.toml. See
# docs/GITHUB_REPOSITORY_CHECK.md.
on:
  pull_request_target:
    types: [opened, synchronize, reopened, edited]

permissions:
  contents: read
  issues: read
  pull-requests: read

concurrency:
  group: nexus-core-issue-completion-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  run:
    name: Nexus Core issue run
    # Same-repository branches only; fork PRs are intentionally excluded.
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.repo.fork == false
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      issues: read
      pull-requests: read
      id-token: write   # required for Sigstore keyless signing
    outputs:
      artifact-name: ${{ steps.gate.outputs.artifact-name }}
      issue-number: ${{ steps.gate.outputs.issue-number }}
      artifact-id: ${{ steps.gate.outputs.artifact-id }}
      outcome: ${{ steps.gate.outputs.outcome }}
    steps:
      - id: gate
        uses: James3014/nexus-core/.github/actions/issue-gate@ffe4392e964d2838fa6e4a069d4810f4436c4870
        with:
          nexus-certify-ref: "ffe4392e964d2838fa6e4a069d4810f4436c4870"
          evidence-universe: trusted-config

  verify:
    name: Nexus Core issue completion   # the required status check
    needs: run
    # Never put a source condition here: a job skipped by `if:` reports as skipped, and
    # GitHub treats a skipped required check as passed. verify must run and fail rather
    # than skip; the guard step below fails closed on fork / cross-repo PRs.
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
      # PR_ALREADY_CLOSED_SKIPPED: receipt-verify re-reads the live PR.
      pull-requests: read
    steps:
      - name: Fail closed on untrusted source or unsuccessful issuer
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          REPOSITORY: ${{ github.repository }}
          RUN_RESULT: ${{ needs.run.result }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" != "pull_request_target" ]; then
            echo "NEXUS_CORE_UNTRUSTED_EVENT: $EVENT_NAME" >&2
            exit 1
          fi
          if [ -z "$HEAD_REPO" ] || [ "$HEAD_REPO" != "$REPOSITORY" ]; then
            echo "NEXUS_CORE_UNTRUSTED_PR_SOURCE: head repository '${HEAD_REPO:-}' is not '$REPOSITORY'" >&2
            exit 1
          fi
          if [ "$RUN_RESULT" != "success" ]; then
            echo "NEXUS_CORE_ISSUER_NOT_SUCCESSFUL: run job result is '$RUN_RESULT'" >&2
            exit 1
          fi

      - uses: James3014/nexus-core/.github/actions/receipt-verify@ffe4392e964d2838fa6e4a069d4810f4436c4870
        with:
          artifact-name: ${{ needs.run.outputs.artifact-name }}
          artifact-id: ${{ needs.run.outputs.artifact-id }}
          # This very workflow file, on the default branch.
          expected-identity: https://github.com/James3014/nexus-open-swe-runtime/.github/workflows/nexus-core-issue-completion.yml@refs/heads/main
          github-repository: ${{ github.repository }}
          head-sha: ${{ github.event.pull_request.head.sha }}
          base-sha: ${{ github.event.pull_request.base.sha }}
          issue-number: ${{ needs.run.outputs.issue-number }}
          gate-outcome: ${{ needs.run.outputs.outcome }}
          nexus-certify-ref: "ffe4392e964d2838fa6e4a069d4810f4436c4870"
