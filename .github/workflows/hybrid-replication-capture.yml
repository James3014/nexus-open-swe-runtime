name: Nexus Hybrid Replication Capture

on:
  issues:
    types: [opened, edited]

permissions: {}

concurrency:
  group: nexus-hybrid-replication-capture-${{ github.repository }}-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  capture:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
      EVENT_PATH: ${{ github.event_path }}
      EVENT_ACTION: ${{ github.event.action }}
      REPOSITORY: ${{ github.repository }}
      RUN_ID: ${{ github.run_id }}
      RUN_ATTEMPT: ${{ github.run_attempt }}
      ACTIVATION_STATE: ${{ vars.NEXUS_HYBRID_REPLICATION_ACTIVATION_STATE }}
      T_AUTO: ${{ vars.NEXUS_HYBRID_REPLICATION_T_AUTO }}
      EXCLUDED_TASKS: ${{ vars.NEXUS_HYBRID_REPLICATION_EXCLUDED_TASKS }}
      EXCLUSION_SET_SHA256: ${{ vars.NEXUS_HYBRID_REPLICATION_EXCLUSION_SET_SHA256 }}
    steps:
      - name: Capture immutable research observation
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations

          import base64
          import datetime as dt
          import gzip
          import hashlib
          import json
          import os
          import re
          import urllib.error
          import urllib.parse
          import urllib.request

          CAPTURE_MARKER = "<!-- NEXUS-HYBRID-REPLICATION-CAPTURE-V1 -->"
          ADMISSION_MARKER = "<!-- NEXUS-HYBRID-REPLICATION-ADMISSION-V1 -->"
          DELTA_MARKER = "<!-- NEXUS-HYBRID-REPLICATION-CONTRACT-DELTA-V1 -->"
          GAP_MARKER = "<!-- NEXUS-HYBRID-REPLICATION-INTAKE-GAP-V1 -->"
          CANDIDATE_REPOSITORIES = (
              "James3014/Nexus-new",
              "James3014/devspace",
              "James3014/nexus-core",
              "James3014/nexus-learning",
              "James3014/nexus-open-swe-runtime",
              "James3014/repository-intelligence-engine",
              "James3014/nexus-runtime",
              "James3014/nexus-opencli-reviewer",
          )

          token = os.environ["GH_TOKEN"]
          repository = os.environ["REPOSITORY"]
          action = os.environ["EVENT_ACTION"]
          source_event_id = f"actions:{os.environ['RUN_ID']}:{os.environ['RUN_ATTEMPT']}"
          activation_state = os.environ.get("ACTIVATION_STATE", "").strip()
          t_auto = os.environ.get("T_AUTO", "").strip()
          expected_exclusion_set_sha256 = os.environ.get("EXCLUSION_SET_SHA256", "").strip()
          excluded = {
              item.strip()
              for item in os.environ.get("EXCLUDED_TASKS", "").split(",")
              if item.strip()
          }

          def canonical(value):
              return json.dumps(value, ensure_ascii=False, sort_keys=True, separators=(",", ":")).encode()

          def digest(value):
              return hashlib.sha256(value).hexdigest()

          def encode_body(value):
              return base64.b64encode(gzip.compress(value.encode(), mtime=0)).decode()

          def request(path, *, method="GET", payload=None):
              data = None if payload is None else json.dumps(payload, ensure_ascii=False).encode()
              req = urllib.request.Request(
                  f"https://api.github.com{path}",
                  data=data,
                  method=method,
                  headers={
                      "Accept": "application/vnd.github+json",
                      "Authorization": f"Bearer {token}",
                      "X-GitHub-Api-Version": "2022-11-28",
                      "User-Agent": "nexus-hybrid-replication-capture",
                      "Content-Type": "application/json",
                  },
              )
              with urllib.request.urlopen(req, timeout=20) as response:
                  raw = response.read()
              return None if not raw else json.loads(raw.decode())

          def implementation_pr_numbers(issue_number):
              found = set()
              for page in range(1, 11):
                  batch = request(
                      f"/repos/{repository}/issues/{issue_number}/timeline?per_page=100&page={page}"
                  ) or []
                  if not isinstance(batch, list):
                      raise RuntimeError("issue_timeline_response_not_list")
                  for item in batch:
                      if not isinstance(item, dict) or item.get("event") != "cross-referenced":
                          continue
                      source = item.get("source") if isinstance(item.get("source"), dict) else {}
                      source_issue = (
                          source.get("issue") if isinstance(source.get("issue"), dict) else {}
                      )
                      if "pull_request" not in source_issue:
                          continue
                      if str(source_issue.get("repository_url") or "") != (
                          f"https://api.github.com/repos/{repository}"
                      ):
                          continue
                      source_number = source_issue.get("number")
                      if isinstance(source_number, int):
                          found.add(source_number)
                  if len(batch) < 100:
                      return sorted(found)
              raise RuntimeError("issue_timeline_exceeds_bounded_pagination")

          def tracked_parent(body_text):
              matches = {
                  int(item)
                  for item in re.findall(
                      r"(?im)^\s*(?:tracks|parent(?:\s+task)?\s*:?)\s+#(\d+)\s*$",
                      body_text,
                  )
              }
              if not matches:
                  return None, None, False
              if len(matches) != 1:
                  return None, None, True
              parent_number = next(iter(matches))
              parent = request(f"/repos/{repository}/issues/{parent_number}")
              return parent_number, str(parent.get("created_at") or ""), False

          event = json.load(open(os.environ["EVENT_PATH"], encoding="utf-8"))
          issue = event["issue"]
          number = int(issue["number"])
          task_key = f"{repository}#{number}"
          comments = request(f"/repos/{repository}/issues/{number}/comments?per_page=100") or []
          bodies = [str(item.get("body") or "") for item in comments if isinstance(item, dict)]

          if action == "opened":
              if any(CAPTURE_MARKER in body for body in bodies):
                  print("capture already exists; idempotent no-op")
                  raise SystemExit(0)

              current_issue = request(f"/repos/{repository}/issues/{number}")
              issue_state_at_admission = str(current_issue.get("state") or "")
              implementation_prs = implementation_pr_numbers(number)
              title = str(current_issue.get("title") or "")
              body = str(current_issue.get("body") or "")
              parent_number, parent_created_at, parent_ambiguous = tracked_parent(body)

              repo_payload = event["repository"]
              default_branch = str(repo_payload["default_branch"])
              ref = request(
                  f"/repos/{repository}/git/ref/heads/{urllib.parse.quote(default_branch, safe='')}"
              )
              base_sha = str(ref["object"]["sha"])
              captured_at = dt.datetime.now(dt.timezone.utc).replace(microsecond=0).isoformat().replace("+00:00", "Z")
              contract = {
                  "body": body,
                  "created_at": str(current_issue["created_at"]),
                  "issue": number,
                  "repository": repository,
                  "title": title,
                  "updated_at": str(current_issue["updated_at"]),
              }
              capture = {
                  "schema": "nexus.hybrid_replication.capture.v1",
                  "repository": repository,
                  "issue_number": number,
                  "created_at": str(current_issue["created_at"]),
                  "captured_at": captured_at,
                  "issue_updated_at": str(current_issue["updated_at"]),
                  "title": title,
                  "body_gzip_base64": encode_body(body),
                  "pre_implementation_revision": base_sha,
                  "default_branch": default_branch,
                  "source_event_id": source_event_id,
                  "contract_sha256": digest(canonical(contract)),
              }
              capture["capture_sha256"] = digest(canonical(capture))
              capture_comment = (
                  f"{CAPTURE_MARKER}\n"
                  "Authority: `RESEARCH_OBSERVATION_ONLY / NO_ENGINEERING_AUTHORITY`\n\n"
                  "<details><summary>Hybrid replication capture receipt</summary>\n\n"
                  "```json\n"
                  + json.dumps(capture, ensure_ascii=False, sort_keys=True, indent=2)
                  + "\n```\n</details>"
              )
              request(
                  f"/repos/{repository}/issues/{number}/comments",
                  method="POST",
                  payload={"body": capture_comment},
              )

              actual_exclusion_set_sha256 = digest(
                  ",".join(sorted(excluded)).encode("utf-8")
              )
              if activation_state != "AUTOMATIC_CAPTURE_READY" or not t_auto:
                  print(
                      "capture persisted; AUTOMATIC_CAPTURE_READY + T_auto are required "
                      "before prospective admission"
                  )
                  raise SystemExit(0)
              if expected_exclusion_set_sha256 != actual_exclusion_set_sha256:
                  raise SystemExit("activation exclusion-set hash mismatch; admission blocked")

              other_repos = [
                  repo
                  for repo in CANDIDATE_REPOSITORIES
                  if repo != repository and (repo in title or repo in body)
              ]
              if task_key == "James3014/Nexus-new#1216":
                  disposition = "EXPERIMENT_CONTROL_ISSUE"
              elif task_key in excluded:
                  disposition = "CONTAMINATION_EXCLUDED"
              elif str(current_issue["created_at"]) < t_auto:
                  disposition = "EXCLUDED_PRE_BOUNDARY"
              elif parent_ambiguous:
                  disposition = "PARENT_TASK_SCOPE_GAP"
              elif parent_created_at is not None:
                  disposition = (
                      "EXCLUDE_PARENT_TASK_PRE_BOUNDARY"
                      if parent_created_at < t_auto
                      else "PARENT_TASK_SCOPE_GAP"
                  )
              elif other_repos:
                  disposition = "CROSS_REPO_SCOPE_GAP"
              elif issue_state_at_admission != "open":
                  disposition = "INTAKE_PROTOCOL_LOSS_TERMINAL_BEFORE_ADMISSION"
              elif implementation_prs:
                  disposition = "INTAKE_PROTOCOL_LOSS_IMPLEMENTATION_PRESENT"
              else:
                  disposition = "ADMITTED_PRIMARY_FRESH_TASK"

              admission = {
                  "schema": "nexus.hybrid_replication.admission.v1",
                  "task_key": task_key,
                  "capture_sha256": capture["capture_sha256"],
                  "disposition": disposition,
                  "activation_boundary": t_auto,
                  "activation_state": activation_state,
                  "exclusion_set_sha256": actual_exclusion_set_sha256,
                  "issue_state_at_admission": issue_state_at_admission,
                  "implementation_pr_numbers": implementation_prs,
                  "tracked_parent_issue_number": parent_number,
                  "tracked_parent_created_at": parent_created_at,
                  "admitted_at": captured_at,
              }
              admission["receipt_sha256"] = digest(canonical(admission))
              admission_comment = (
                  f"{ADMISSION_MARKER}\n"
                  "Authority: `RESEARCH_OBSERVATION_ONLY / NO_ENGINEERING_AUTHORITY`\n\n"
                  "```json\n"
                  + json.dumps(admission, ensure_ascii=False, sort_keys=True, indent=2)
                  + "\n```"
              )
              request(
                  f"/repos/{repository}/issues/{number}/comments",
                  method="POST",
                  payload={"body": admission_comment},
              )
              print(f"capture + admission persisted: {task_key} {disposition}")
              raise SystemExit(0)

          if action == "edited":
              capture_bodies = [body for body in bodies if CAPTURE_MARKER in body]
              if len(capture_bodies) != 1:
                  gap = {
                      "schema": "nexus.hybrid_replication.intake_gap.v1",
                      "task_key": task_key,
                      "reason": "opening_capture_missing_or_ambiguous_before_edit",
                      "source_event_id": source_event_id,
                  }
                  gap["receipt_sha256"] = digest(canonical(gap))
                  comment = GAP_MARKER + "\n\n```json\n" + json.dumps(gap, sort_keys=True, indent=2) + "\n```"
                  if not any(gap["receipt_sha256"] in body for body in bodies):
                      request(
                          f"/repos/{repository}/issues/{number}/comments",
                          method="POST",
                          payload={"body": comment},
                      )
                  raise SystemExit("opening capture missing or ambiguous; intake gap recorded")

              source = capture_bodies[0]
              start = source.find("```json")
              start = source.find("\n", start)
              end = source.find("```", start + 1)
              capture = json.loads(source[start + 1 : end])
              delta = {
                  "schema": "nexus.hybrid_replication.contract_delta.v1",
                  "task_key": task_key,
                  "original_capture_sha256": str(capture["capture_sha256"]),
                  "edited_at": dt.datetime.now(dt.timezone.utc).replace(microsecond=0).isoformat().replace("+00:00", "Z"),
                  "issue_updated_at": str(issue["updated_at"]),
                  "title": str(issue.get("title") or ""),
                  "body_gzip_base64": encode_body(str(issue.get("body") or "")),
                  "source_event_id": source_event_id,
              }
              delta["delta_sha256"] = digest(canonical(delta))
              if any(delta["delta_sha256"] in body for body in bodies):
                  print("delta already exists; idempotent no-op")
                  raise SystemExit(0)
              comment = (
                  f"{DELTA_MARKER}\n"
                  "Authority: `RESEARCH_OBSERVATION_ONLY / NO_ENGINEERING_AUTHORITY`\n\n"
                  "```json\n"
                  + json.dumps(delta, ensure_ascii=False, sort_keys=True, indent=2)
                  + "\n```"
              )
              request(
                  f"/repos/{repository}/issues/{number}/comments",
                  method="POST",
                  payload={"body": comment},
              )
              print(f"contract delta persisted: {task_key}")
              raise SystemExit(0)

          raise SystemExit(f"unsupported issue action: {action}")
          PY
