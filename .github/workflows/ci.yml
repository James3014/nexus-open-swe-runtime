name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"
      - name: Set up Python
        run: uv python install 3.11
      - name: Sync dependencies
        run: uv sync --locked
      - name: Run Ruff
        run: uv run ruff check .
      - name: Run Pytest
        run: uv run pytest -q
      - name: CLI protocol smoke
        run: echo '{}' | uv run nexus-open-swe-runtime
