version = 2
base_ref = "origin/main"
allowed_patterns = ["**"]
deletion_policy = "FORBID"
universe_generation = 2

[isolation]
mode = "container"
image = "ghcr.io/astral-sh/uv:python3.11-bookworm@sha256:58683a39536f1f4ed2e1dd79cf155edccfb47731aba8964bd0312aac942126cf"
network = "bridge"

[[materials]]
id = "nexus-new-consumer"
observe_command = ["bash", "-lc", "set -euo pipefail; export NEXUS_NEW_CONSUMER_ROOT=\"$(bash scripts/ci/nexus_core_provision_consumer.sh 2999d62e0fb463646a12a659eefeee0aaf3367ea)\"; printf 'git-commit:%s\n' \"$(git -c safe.directory='*' -C \"$NEXUS_NEW_CONSUMER_ROOT\" rev-parse HEAD)\""]
timeout_seconds = 300
logical_subject_id = "dependency/nexus-new-consumer"
evidence_kind = "resolved-dependency"
requirement_mode = "REQUIRED"
applicability = "APPLICABLE"
expected_identity = "git-commit:2999d62e0fb463646a12a659eefeee0aaf3367ea"

[[verifiers]]
id = "cross-repo-acceptance"
command = ["bash", "-lc", "set -euo pipefail; export NEXUS_NEW_CONSUMER_ROOT=\"$(bash scripts/ci/nexus_core_provision_consumer.sh 2999d62e0fb463646a12a659eefeee0aaf3367ea)\" NEXUS_NEW_CONSUMER_REQUIRED=1; uv run pytest -q tests/test_cross_repo_acceptance.py || exit $?"]
timeout_seconds = 1800
logical_subject_id = "open-swe/cross-repo-acceptance"
evidence_kind = "test-result"
requirement_mode = "REQUIRED"
applicability = "APPLICABLE"
required_material_ids = ["nexus-new-consumer"]

[[verifiers]]
id = "full-tests"
command = ["bash", "-lc", "set -euo pipefail; export NEXUS_NEW_CONSUMER_ROOT=\"$(bash scripts/ci/nexus_core_provision_consumer.sh 2999d62e0fb463646a12a659eefeee0aaf3367ea)\" NEXUS_NEW_CONSUMER_REQUIRED=1; uv run pytest -q || exit $?"]
timeout_seconds = 1800
logical_subject_id = "open-swe/full-tests"
evidence_kind = "test-result"
requirement_mode = "REQUIRED"
applicability = "APPLICABLE"
required_material_ids = ["nexus-new-consumer"]

[[verifiers]]
id = "ruff"
command = ["uv", "run", "ruff", "check", "."]
timeout_seconds = 600
logical_subject_id = "open-swe/ruff"
evidence_kind = "static-analysis"
requirement_mode = "REQUIRED"
applicability = "APPLICABLE"

[[verifiers]]
id = "cli-smoke"
command = ["bash", "-lc", "echo '{}' | uv run nexus-open-swe-runtime"]
timeout_seconds = 600
logical_subject_id = "open-swe/cli-smoke"
evidence_kind = "package-smoke"
requirement_mode = "REQUIRED"
applicability = "APPLICABLE"
